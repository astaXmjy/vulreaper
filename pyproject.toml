[project]
name = "vul_reaper"
version = "0.1.0"
description = "vul_reaper using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.175.0,<1.0.0"
]

[project.scripts]
vul_reaper = "vul_reaper.main:run"
run_crew = "vul_reaper.main:run"
train = "vul_reaper.main:train"
replay = "vul_reaper.main:replay"
test = "vul_reaper.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
